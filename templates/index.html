<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
</head>
<body>
    <h2>URL Shortener</h2>

    <!-- Create Short URL -->
    <h3>Create Short URL</h3>
    <form id="shortenForm">
        <input type="text" id="urlInput" placeholder="Enter URL to shorten" required>
        <button type="submit">Shorten</button>
    </form>
    <p id="shortenedUrl"></p>

    <!-- Retrieve Original URL -->
    <h3>Retrieve Original URL</h3>
    <form id="retrieveForm">
        <input type="text" id="codeInput" placeholder="Enter short code" required>
        <button type="submit">Retrieve</button>
    </form>
    <p id="retrievedUrl"></p>

    <!-- Update Short URL -->
    <h3>Update Short URL</h3>
    <form id="updateForm">
        <input type="text" id="updateCodeInput" placeholder="Enter short code to update" required>
        <input type="text" id="newCodeInput" placeholder="Enter new short code" required>
        <button type="submit">Update</button>
    </form>
    <p id="updatedUrl"></p>

    <script>
        // 3.1 Shorten URL
        document.getElementById('shortenForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const url = document.getElementById('urlInput').value;

            const response = await fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            const data = await response.json();
            if (data.shortCode) {
                document.getElementById('shortenedUrl').innerHTML =
                    `Shortened URL: <a href="http://127.0.0.1:5000/${data.shortCode}" target="_blank">http://127.0.0.1:5000/${data.shortCode}</a>`;
            } else {
                document.getElementById('shortenedUrl').innerText = 'Error creating short URL.';
            }
        });

        // 3.2 Retrieve Original URL
        document.getElementById('retrieveForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('codeInput').value;

            const response = await fetch(`/shorten/${code}`);
            const data = await response.json();

            if (data.url) {
                document.getElementById('retrievedUrl').innerText = `Original URL: ${data.url}`;
            } else {
                document.getElementById('retrievedUrl').innerText = 'Short code not found.';
            }
        });

        // 3.3 Update Short URL
        document.getElementById('updateForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('updateCodeInput').value;
            const newCode = document.getElementById('newCodeInput').value;

            const response = await fetch(`/shorten/${code}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ shortCode: newCode })
            });

            const data = await response.json();

            if (data.shortCode) {
                document.getElementById('updatedUrl').innerHTML =
                    `Updated! New short URL: <a href="http://127.0.0.1:5000/${data.shortCode}" target="_blank">http://127.0.0.1:5000/${data.shortCode}</a>`;
            } else {
                document.getElementById('updatedUrl').innerText = data.error || 'Error updating URL.';
            }
        });
    </script>
</body>
</html>
